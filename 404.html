<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="That Value Contributed page is not here." />
<title>Value Contributed — page not found</title>
<style>
  body { margin: 0; padding: 4rem 1.5rem; color: #13251f;
         background: radial-gradient(circle at 92% 0%, rgb(215 255 84 / 30%),
                     transparent 28rem) #f4f0e7;
         font: 16px/1.6 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif; }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.1; margin: 0 0 1rem; }
  p { color: #607068; }
  a { color: #1f6b50; font-weight: 600; }
  ul { margin: 1.25rem 0 0; padding: 0; list-style: none;
        display: flex; flex-wrap: wrap; gap: 0.6rem 1.4rem; }
</style>
<main>
  <h1>That page is not here</h1>
  <p>Value Contributed has a rankings table, a season view, player and team
     pages and a page describing how the statistic is calculated.</p>
  <ul id="not-found-tabs">
    <li><a href="./">Rankings</a></li>
    <li><a href="./seasons/">Seasons</a></li>
    <li><a href="./players/">Players</a></li>
    <li><a href="./teams/">Teams</a></li>
    <li><a href="./how-it-works/">Methodology</a></li>
  </ul>
</main>
<script>
  /* This one file answers every missing path at every depth, and the browser
     keeps the address it asked for, so "./" is only the site root when the
     missing path was one level deep. The site root is whatever comes before the
     first segment this site owns; when none of them is in the path, the
     relative links above are already right. */
  (function fixNotFoundLinks() {
    var owned = ["players", "teams", "seasons", "compare", "how-it-works",
                 "experiments", "data", "api", "dashboard-assets"];
    var parts = location.pathname.split("/");
    for (var index = 1; index < parts.length; index += 1) {
      if (owned.indexOf(parts[index]) === -1) continue;
      var base = parts.slice(0, index).join("/") + "/";
      var links = document.querySelectorAll("#not-found-tabs a");
      for (var link = 0; link < links.length; link += 1) {
        links[link].setAttribute(
          "href", base + links[link].getAttribute("href").replace(/^\.\//, ""),
        );
      }
      return;
    }
  })();
</script>
